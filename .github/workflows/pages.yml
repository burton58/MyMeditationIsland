# Stellt die App automatisch online.
#
# Nach jeder Speicherung wird der Inhalt des Projekts als Webseite
# veröffentlicht und ist danach unter
#   https://burton58.github.io/MyMeditationIsland/
# erreichbar. "enablement: true" schaltet die Veröffentlichung beim ersten
# Durchlauf selbst ein - es muss dafür niemand etwas in den Einstellungen
# anklicken.
name: Seite veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Läuft immer nur eine Veröffentlichung gleichzeitig; eine begonnene wird
# nicht abgebrochen, damit nie eine halbe Fassung online steht.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.veroeffentlichung.outputs.page_url }}
    steps:
      - name: Projekt holen
        uses: actions/checkout@v4

      - name: Veröffentlichung vorbereiten
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Dateien einpacken
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Online stellen
        id: veroeffentlichung
        uses: actions/deploy-pages@v4
